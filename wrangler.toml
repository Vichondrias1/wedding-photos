# Cloudflare Worker settings. You normally don't need to change anything here.
name = "wedding-photos"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Keep variables you set in the Cloudflare dashboard when you redeploy.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wedding-photos"
