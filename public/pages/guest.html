<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{COUPLE}} · Share your photos</title>
<link rel="stylesheet" href="/app.css">
<!--WEDDING-->
<style>
  main { max-width: 560px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
  .hero { text-align: center; padding: 36px 8px 24px; }
  .hero img { width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radius); margin-bottom: 26px; display: block; }
  .hero img.logo { width: min(210px, 56vw); height: auto; max-height: none; object-fit: contain; border-radius: 0; margin: -12px auto 10px; }
  .kicker { text-transform: uppercase; letter-spacing: 0.22em; font-size: 12px; color: var(--muted); }
  .hero h1 { font-size: clamp(44px, 13vw, 64px); margin: 10px 0 8px; }
  .meta { font-family: var(--display); font-style: italic; font-size: 20px; color: var(--muted); }
  .rule { width: 56px; height: 1px; background: var(--accent); margin: 20px auto; opacity: 0.7; }
  .welcome { font-size: 16px; color: var(--text); max-width: 440px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-top: 18px; }
  .pick { width: 100%; min-height: 64px; font-size: 18px; margin-top: 16px; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; text-align: center; }
  .closed { text-align: center; padding: 32px 20px; }
  .closed h2 { font-size: 30px; margin-bottom: 8px; }
  .summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .summary b { font-weight: 600; }
  .list { list-style: none; margin: 12px 0 0; padding: 0; }
  .item { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .thumb { width: 52px; height: 52px; border-radius: 8px; background: var(--soft) center/cover no-repeat; display: grid; place-items: center; font-size: 20px; color: var(--primary); }
  .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .item.done .bar > i { background: color-mix(in srgb, var(--primary) 70%, #fff); }
  .item.error .status { color: var(--danger); }
  .retry { border: 0; background: none; color: var(--danger); font: 600 12px var(--body); text-decoration: underline; padding: 0; cursor: pointer; }
  .thanks { text-align: center; padding: 8px 0 2px; font-family: var(--display); font-size: 24px; }
  .admin-note { text-align: center; font-size: 13px; background: var(--soft); border-radius: 10px; padding: 8px 12px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <img id="headerPhoto" alt="" hidden>
    <img id="logo" class="logo" alt="" hidden>
    <div class="kicker">Share the moments</div>
    <h1 id="names"></h1>
    <div class="meta" id="meta"></div>
    <div class="rule"></div>
    <p class="welcome" id="welcome"></p>
  </header>

  <p class="admin-note" id="adminNote" hidden>You're logged in as admin — uploads work even outside the upload window.</p>

  <section class="card closed" id="closed" hidden>
    <h2 id="closedTitle"></h2>
    <p class="hint" id="closedHint"></p>
  </section>

  <section class="card" id="uploader" hidden>
    <label for="guestName">Your name (optional)</label>
    <input type="text" id="guestName" autocomplete="name" maxlength="50" placeholder="So we know who took these">
    <input type="file" id="files" accept="image/*,video/*" multiple hidden>
    <button class="btn pick" id="pickBtn" type="button">Choose photos &amp; videos</button>
    <p class="hint">Full original quality · photos and videos up to 5 GB each</p>
  </section>

  <section class="card" id="queue" hidden>
    <div class="summary">
      <span id="summaryText"></span>
      <button class="btn small ghost" id="retryAll" type="button" hidden>Retry failed</button>
    </div>
    <div class="bar"><i id="totalBar"></i></div>
    <div class="thanks" id="thanks" hidden>Thank you! 💛</div>
    <ul class="list" id="list"></ul>
  </section>
</main>

<script type="module">
const W = window.WEDDING;
const $ = (id) => document.getElementById(id);
const MiB = 1024 * 1024;
const SINGLE_LIMIT = 90 * MiB;   // bigger files use multipart (Worker body cap is 100 MB)
const PART_SIZE = 25 * MiB;
const MAX_FILE = 5 * 1024 * MiB;
const PARALLEL = 3;
const AUTO_RETRIES = 3;

// ---------- header ----------
if (W.font === "modern") document.documentElement.classList.add("font-modern");
$("names").textContent = W.coupleNames;
$("meta").textContent = [W.weddingDate, W.venue].filter(Boolean).join(" · ");
$("welcome").textContent = W.welcomeMessage;
if (W.headerPhoto) { $("headerPhoto").src = W.headerPhoto; $("headerPhoto").hidden = false; }
if (W.logo) { $("logo").src = W.logo; $("logo").hidden = false; }

// ---------- upload window ----------
function fmtDate(iso, withTime) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const opts = { month: "long", day: "numeric", timeZone: W.timezone || undefined };
  if (withTime) Object.assign(opts, { hour: "numeric", minute: "2-digit" });
  try { return new Intl.DateTimeFormat("en-US", opts).format(d); }
  catch { delete opts.timeZone; return new Intl.DateTimeFormat("en-US", opts).format(d); }
}

async function refreshStatus() {
  let s = { open: true, state: "open", isAdmin: false };
  try { s = await (await fetch("/api/status", { cache: "no-store" })).json(); } catch {}
  const canUpload = s.open || s.isAdmin;
  $("uploader").hidden = !canUpload;
  $("closed").hidden = canUpload;
  $("adminNote").hidden = !(s.isAdmin && !s.open);
  if (!canUpload) {
    if (s.state === "before") {
      $("closedTitle").textContent = "Uploads open on " + fmtDate(W.uploadOpens);
      $("closedHint").textContent = "Come back from " + fmtDate(W.uploadOpens, true) + " to share your photos and videos.";
    } else {
      $("closedTitle").textContent = "Uploads are closed";
      $("closedHint").textContent = "Thank you so much for sharing your photos and videos with us!";
    }
  }
  return s;
}
let status = await refreshStatus();
// Flip the page open automatically if someone is waiting on it.
if (status.state === "before") {
  const wait = new Date(W.uploadOpens) - Date.now();
  if (wait > 0 && wait < 864e5) setTimeout(refreshStatus, wait + 1500);
}

// ---------- name ----------
const NAME_KEY = "wedding-guest-name";
try { $("guestName").value = localStorage.getItem(NAME_KEY) || ""; } catch {}
$("guestName").addEventListener("change", () => {
  try { localStorage.setItem(NAME_KEY, $("guestName").value.trim()); } catch {}
});

// ---------- queue ----------
const items = [];
let running = 0;

$("pickBtn").addEventListener("click", () => $("files").click());
$("files").addEventListener("change", (e) => {
  const guest = $("guestName").value.trim();
  try { localStorage.setItem(NAME_KEY, guest); } catch {}
  for (const file of e.target.files) addItem(file, guest);
  e.target.value = "";
  pump();
});
$("retryAll").addEventListener("click", () => {
  for (const it of items) if (it.state === "error") retry(it);
});

function addItem(file, guest) {
  const li = document.createElement("li");
  li.className = "item";
  li.innerHTML = `<div class="thumb">${file.type.startsWith("video/") ? "▶" : "✦"}</div>
    <div><div class="name"></div><div class="bar"><i></i></div>
    <div class="status"><span class="msg">Waiting…</span><span class="pct"></span></div></div>`;
  li.querySelector(".name").textContent = file.name;
  $("list").prepend(li);
  const it = { file, guest, li, state: "queued", sent: 0, tries: 0, mpu: null, key: null };
  if (file.size > MAX_FILE) { fail(it, "Too large (max 5 GB)", false); }
  items.push(it);
  $("queue").hidden = false;
  render();
  makeThumb(file).then((blob) => {
    it.thumb = blob;
    if (blob) li.querySelector(".thumb").style.backgroundImage = `url(${URL.createObjectURL(blob)})`, li.querySelector(".thumb").textContent = "";
  });
}

function pump() {
  while (running < PARALLEL) {
    const it = items.find((x) => x.state === "queued");
    if (!it) break;
    running++;
    it.state = "uploading";
    run(it).finally(() => { running--; pump(); render(); });
  }
  render();
}

async function run(it) {
  setMsg(it, "Uploading…");
  try {
    if (it.file.size <= SINGLE_LIMIT) await uploadSingle(it);
    else await uploadMultipart(it);
    it.state = "done";
    it.sent = it.file.size;
    it.li.classList.add("done");
    setMsg(it, "Uploaded ✓", "");
    await uploadThumb(it);
  } catch (err) {
    if (err.fatal) return fail(it, err.message, false);
    it.tries++;
    if (it.tries < AUTO_RETRIES) {
      setMsg(it, `Connection hiccup — retrying (${it.tries}/${AUTO_RETRIES - 1})…`);
      await sleep(1500 * it.tries * it.tries);
      return run(it);
    }
    fail(it, err.message || "Upload failed", true);
  }
}

function fail(it, message, canRetry) {
  it.state = "error";
  it.li.classList.add("error");
  const st = it.li.querySelector(".status");
  st.innerHTML = "";
  const msg = document.createElement("span");
  msg.textContent = message;
  st.append(msg);
  if (canRetry) {
    const b = document.createElement("button");
    b.className = "retry";
    b.type = "button";
    b.textContent = "Tap to retry";
    b.onclick = () => retry(it);
    st.append(b);
  }
  render();
}

function retry(it) {
  it.state = "queued";
  it.tries = 0;
  it.li.classList.remove("error");
  it.li.querySelector(".status").innerHTML = `<span class="msg">Waiting…</span><span class="pct"></span>`;
  pump();
}

// ---------- transport ----------
function xhr(method, url, body, onProgress, contentType) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open(method, url);
    if (contentType) x.setRequestHeader("Content-Type", contentType);
    if (onProgress) x.upload.onprogress = (e) => onProgress(e.loaded);
    x.onload = () => {
      let data = {};
      try { data = JSON.parse(x.responseText); } catch {}
      if (x.status >= 200 && x.status < 300) return resolve(data);
      const e = new Error(data.error || `Upload failed (${x.status})`);
      // 4xx other than timeouts/rate limits won't fix themselves by retrying.
      e.fatal = x.status >= 400 && x.status < 500 && ![408, 429].includes(x.status);
      if (x.status === 403) refreshStatus();
      reject(e);
    };
    x.onerror = () => reject(new Error("Connection lost"));
    x.ontimeout = () => reject(new Error("Connection timed out"));
    x.send(body);
  });
}

async function postJson(url, data) {
  return xhr("POST", url, JSON.stringify(data), null, "application/json");
}

async function uploadSingle(it) {
  const q = new URLSearchParams({ name: it.file.name, guest: it.guest });
  const res = await xhr("PUT", "/api/upload?" + q, it.file, (n) => progress(it, n), it.file.type || "application/octet-stream");
  it.key = res.key;
}

async function uploadMultipart(it) {
  // it.mpu survives retries, so a retry continues from the part that failed.
  if (!it.mpu) {
    const res = await postJson("/api/mpu/create", { name: it.file.name, type: it.file.type, size: it.file.size, guest: it.guest });
    it.mpu = { key: res.key, uploadId: res.uploadId, parts: [] };
  }
  const { key, uploadId, parts } = it.mpu;
  const total = Math.ceil(it.file.size / PART_SIZE);
  for (let n = parts.length + 1; n <= total; n++) {
    const start = (n - 1) * PART_SIZE;
    const blob = it.file.slice(start, Math.min(start + PART_SIZE, it.file.size));
    const q = new URLSearchParams({ key, uploadId, part: n });
    let partTry = 0;
    for (;;) {
      try {
        const res = await xhr("PUT", "/api/mpu/part?" + q, blob, (b) => progress(it, start + b), "application/octet-stream");
        parts.push({ partNumber: res.partNumber, etag: res.etag });
        break;
      } catch (e) {
        if (e.fatal || ++partTry >= 3) throw e;
        setMsg(it, `Retrying part ${n} of ${total}…`);
        await sleep(2000 * partTry);
      }
    }
  }
  try {
    await postJson("/api/mpu/complete", { key, uploadId, parts });
  } catch (e) {
    if (e.fatal) it.mpu = null; // upload session is gone; start fresh next time
    throw e;
  }
  it.key = key;
}

async function uploadThumb(it) {
  // Wait briefly for the thumbnail if it's still being made.
  for (let i = 0; i < 20 && it.thumb === undefined; i++) await sleep(500);
  if (!it.thumb || !it.key) return;
  try { await xhr("PUT", "/api/thumb?key=" + encodeURIComponent(it.key), it.thumb, null, "image/jpeg"); } catch {}
}

// ---------- thumbnails (made on the phone; the server has no CPU to spare) ----------
const THUMB = 480;
let thumbChain = Promise.resolve();
function makeThumb(file) {
  // One at a time so phones don't run out of memory on big batches.
  const p = thumbChain.then(() => (file.type.startsWith("video/") ? videoThumb(file) : imageThumb(file)).catch(() => null));
  thumbChain = p;
  return p;
}
function toJpeg(source, w, h) {
  const scale = Math.min(1, THUMB / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * scale));
  c.height = Math.max(1, Math.round(h * scale));
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob((b) => { c.width = c.height = 0; r(b); }, "image/jpeg", 0.8));
}
function imageThumb(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.decoding = "async";
    img.onload = async () => {
      try { resolve(await toJpeg(img, img.naturalWidth, img.naturalHeight)); }
      catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}
function videoThumb(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    let done = false;
    const finish = (val, err) => {
      if (done) return;
      done = true;
      v.removeAttribute("src"); v.load();
      URL.revokeObjectURL(url);
      err ? reject(err) : resolve(val);
    };
    const timer = setTimeout(() => finish(null, new Error("timeout")), 10000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadedmetadata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
    v.onseeked = async () => {
      clearTimeout(timer);
      try { finish(await toJpeg(v, v.videoWidth, v.videoHeight)); } catch (e) { finish(null, e); }
    };
    v.onerror = () => { clearTimeout(timer); finish(null, new Error("video")); };
    v.src = url;
  });
}

// ---------- progress UI ----------
function progress(it, sent) {
  it.sent = sent;
  const pct = Math.min(100, Math.round((sent / it.file.size) * 100));
  it.li.querySelector(".bar > i").style.width = pct + "%";
  const p = it.li.querySelector(".pct");
  if (p) p.textContent = pct + "%";
  renderTotals();
}
function setMsg(it, text, pct) {
  const m = it.li.querySelector(".msg");
  if (m) m.textContent = text;
  if (pct !== undefined) { const p = it.li.querySelector(".pct"); if (p) p.textContent = pct; }
}
let rafPending = false;
function renderTotals() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    let total = 0, sent = 0;
    for (const it of items) { total += it.file.size; sent += it.state === "done" ? it.file.size : it.sent; }
    $("totalBar").style.width = (total ? (sent / total) * 100 : 0) + "%";
  });
}
function render() {
  const done = items.filter((i) => i.state === "done").length;
  const failed = items.filter((i) => i.state === "error").length;
  const active = items.length - done - failed;
  $("summaryText").innerHTML = active
    ? `Uploading <b>${done}</b> of <b>${items.length}</b>… keep this page open`
    : `<b>${done}</b> of <b>${items.length}</b> uploaded` + (failed ? ` · <b>${failed}</b> failed` : "");
  $("retryAll").hidden = !failed || active > 0;
  $("thanks").hidden = !(items.length && done === items.length);
  for (const it of items) if (it.state === "done") it.li.querySelector(".bar > i").style.width = "100%";
  renderTotals();
  setBusy(active > 0);
}

// ---------- keep the phone awake & warn before leaving ----------
let busy = false, wakeLock = null;
async function lockScreen() {
  try { if (busy && "wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); } } catch {}
}
function setBusy(b) {
  if (b === busy) return;
  busy = b;
  if (b) lockScreen();
  else if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") lockScreen(); });
window.addEventListener("beforeunload", (e) => { if (busy) { e.preventDefault(); e.returnValue = ""; } });

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
</script>
</body>
</html>
