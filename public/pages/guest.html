<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{COUPLE}} · Share your photos</title>
<link rel="stylesheet" href="/app.css">
<!--WEDDING-->
<style>
  main { max-width: 520px; margin: 0 auto; padding: 0 24px calc(48px + env(safe-area-inset-bottom)); }
  .hero { text-align: center; padding: 40px 0 8px; }
  .hero img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 4px; margin-bottom: 28px; display: block; }
  .hero img.logo { width: min(220px, 60vw); height: auto; max-height: none; object-fit: contain; border-radius: 0; margin: -16px auto 6px; }
  .hero h1 { font-size: clamp(48px, 14vw, 68px); line-height: 1; margin: 6px 0 12px; letter-spacing: -0.01em; }
  .hero h1 .amp { font-style: italic; color: var(--accent); font-size: 0.86em; padding: 0 0.04em; }
  .meta { font-family: var(--display); font-variant: small-caps; text-transform: lowercase; letter-spacing: 0.16em; font-size: 17px; color: var(--muted); }
  .rule { width: 56px; height: 1px; background: var(--accent); margin: 24px auto; }
  .welcome { font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.4; color: var(--text); max-width: 400px; margin: 0 auto; }
  .card { border-top: 1px solid var(--line); padding: 26px 0 0; margin-top: 30px; }
  #uploader label { font-family: var(--display); font-size: 18px; color: var(--text); margin-bottom: 0; }
  #uploader input[type="text"] { border: 0; border-bottom: 1px solid color-mix(in srgb, var(--text) 35%, var(--bg)); border-radius: 0; background: transparent; padding: 0 2px; min-height: 44px; }
  #uploader input[type="text"]:focus-visible { outline: 0; border-bottom: 2px solid var(--primary); }
  #uploader input::placeholder { color: color-mix(in srgb, var(--text) 40%, var(--bg)); }
  .pick { width: 100%; min-height: 60px; font-size: 21px; margin-top: 26px; }
  .hint { font-family: var(--display); font-style: italic; font-size: 17px; color: var(--muted); margin: 12px 0 0; text-align: center; }
  .closed { text-align: center; }
  .closed h2 { font-size: 30px; margin-bottom: 4px; }
  .summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-family: var(--display); font-size: 19px; }
  .summary b { font-weight: 600; }
  .list { list-style: none; margin: 14px 0 0; padding: 0; }
  .item { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .thumb { width: 52px; height: 52px; border-radius: 3px; background: var(--soft) center/cover no-repeat; }
  .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; justify-content: space-between; gap: 8px; }
  .bar { height: 3px; border-radius: 0; }
  .item.done .bar > i { background: color-mix(in srgb, var(--primary) 55%, var(--bg)); }
  .item.error .status { color: var(--danger); }
  .retry { border: 0; background: none; color: var(--danger); font: 600 12px var(--body); text-decoration: underline; padding: 0; cursor: pointer; }
  /* Finished uploads land on a little pile of prints. */
  .pile { position: relative; height: 150px; margin: 6px 0 4px; perspective: 700px; }
  .print { position: absolute; left: 50%; top: 18px; width: 92px; height: 106px; margin-left: -46px; padding: 6px 6px 20px; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 6px color-mix(in srgb, var(--text) 12%, transparent); }
  .print i { display: block; width: 100%; height: 100%; background: var(--soft) center/cover no-repeat; }
  .thanks { text-align: center; padding: 14px 0 4px; font-family: var(--display); font-style: italic; font-size: 26px; color: var(--primary); }
  .countdown { display: flex; justify-content: center; gap: 10px; margin: 24px auto 18px; }
  .countdown > div { display: flex; flex-direction: column; align-items: center; }
  /* Flip-clock tile: two halves of a card, split by a hairline. */
  .tile { position: relative; width: 62px; height: 70px; perspective: 320px; font-family: var(--display); font-size: 44px; color: var(--primary); font-variant-numeric: lining-nums tabular-nums; }
  .tile.wide { width: 80px; }
  .tile::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: color-mix(in srgb, var(--text) 10%, var(--bg)); z-index: 3; }
  .half { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; background: var(--card); border: 1px solid var(--line); }
  .half span { position: absolute; left: 0; right: 0; height: 200%; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .half.top { top: 0; border-bottom: 0; border-radius: 3px 3px 0 0; }
  .half.bot { bottom: 0; border-top: 0; border-radius: 0 0 3px 3px; background: color-mix(in srgb, var(--card) 92%, var(--text)); }
  .half.top span { top: 0; }
  .half.bot span { bottom: 0; }
  .half.flip-out { z-index: 2; transform-origin: bottom; backface-visibility: hidden; animation: flipOut .3s ease-in forwards; }
  .half.flip-in { z-index: 2; transform-origin: top; transform: rotateX(90deg); backface-visibility: hidden; animation: flipIn .3s .3s ease-out forwards; }
  @keyframes flipOut { to { transform: rotateX(-90deg); } }
  @keyframes flipIn { to { transform: rotateX(0deg); } }
  .countdown small { display: block; margin-top: 6px; font-family: var(--display); font-variant: small-caps; text-transform: lowercase; letter-spacing: 0.18em; font-size: 15px; color: var(--muted); }
  .burst { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  /* Motion: only for people whose phone isn't set to reduce motion. */
  @property --reveal { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes reveal { from { --reveal: 0deg; } to { --reveal: 400deg; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes sheen { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @media (prefers-reduced-motion: no-preference) {
    .motion .hero img.logo { opacity: 0; }
    .motion .hero img.logo.go {
      opacity: 1;
      -webkit-mask-image: conic-gradient(from 200deg, #000 calc(var(--reveal) - 40deg), transparent var(--reveal));
      mask-image: conic-gradient(from 200deg, #000 calc(var(--reveal) - 40deg), transparent var(--reveal));
      animation: reveal 1.5s cubic-bezier(.45, 0, .2, 1) both;
    }
    .motion .hero h1 { animation: rise .9s ease-out both; animation-delay: var(--t0); }
    .motion .hero .meta, .motion .hero .welcome { animation: fade .8s ease-out both; }
    .motion .hero .meta { animation-delay: var(--t1); }
    .motion .hero .rule { animation: draw .7s ease-out both; animation-delay: var(--t2); }
    .motion .hero .welcome { animation-delay: var(--t3); }
    .motion #uploader, .motion #closed { animation: rise .6s ease-out both; animation-delay: var(--t3); }
    #queue.busy .item:not(.done):not(.error) .bar > i, #queue.busy #totalBar {
      background-image: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .5) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: sheen 1.6s linear infinite;
    }
    .item { animation: rise .35s ease-out both; }
    .thanks:not([hidden]) { animation: rise .6s ease-out both; }
  }
  .admin-note { text-align: center; font-size: 13px; color: var(--muted); border: 1px dashed var(--line); padding: 8px 12px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <img id="headerPhoto" alt="" hidden>
    <img id="logo" class="logo" alt="" hidden>
    <h1 id="names"></h1>
    <div class="meta" id="meta"></div>
    <div class="rule"></div>
    <p class="welcome" id="welcome"></p>
  </header>

  <p class="admin-note" id="adminNote" hidden>You're logged in as admin, so uploads work outside the upload window too.</p>

  <section class="card closed" id="closed" hidden>
    <h2 id="closedTitle"></h2>
    <div class="countdown" id="countdown" aria-hidden="true" hidden>
      <div><div class="tile wide" id="cdD"></div><small>days</small></div>
      <div><div class="tile" id="cdH"></div><small>hours</small></div>
      <div><div class="tile" id="cdM"></div><small>min</small></div>
      <div><div class="tile" id="cdS"></div><small>sec</small></div>
    </div>
    <p class="hint" id="closedHint"></p>
  </section>

  <section class="card" id="uploader" hidden>
    <label for="guestName">Your name</label>
    <input type="text" id="guestName" autocomplete="name" maxlength="50" placeholder="Optional, so we know who took them">
    <input type="file" id="files" accept="image/*,video/*" multiple hidden>
    <button class="btn pick" id="pickBtn" type="button">Add your photos</button>
    <p class="hint">Videos too. Nothing gets compressed.</p>
  </section>

  <section class="card" id="queue" hidden>
    <div class="summary">
      <span id="summaryText"></span>
      <button class="btn small ghost" id="retryAll" type="button" hidden>Retry failed</button>
    </div>
    <div class="bar"><i id="totalBar"></i></div>
    <div class="pile" id="pile" aria-hidden="true" hidden></div>
    <div class="thanks" id="thanks" hidden>Got them. Thank you.</div>
    <ul class="list" id="list"></ul>
  </section>
</main>

<script type="module">
const W = window.WEDDING;
const $ = (id) => document.getElementById(id);
const MiB = 1024 * 1024;
const SINGLE_LIMIT = 90 * MiB;   // bigger files use multipart (Worker body cap is 100 MB)
const PART_SIZE = 25 * MiB;
const MAX_FILE = 5 * 1024 * MiB;
const PARALLEL = 3;
const AUTO_RETRIES = 3;

// ---------- header ----------
if (W.font === "modern") document.documentElement.classList.add("font-modern");
// Names with the "&" (or "and") set in copper italic, like printed stationery.
for (const part of W.coupleNames.split(/(\s(?:&|and|\+)\s)/)) {
  if (/^\s(?:&|and|\+)\s$/.test(part)) {
    const amp = document.createElement("span");
    amp.className = "amp";
    amp.textContent = part.trim();
    $("names").append(" ", amp, " ");
  } else $("names").append(part);
}
$("meta").textContent = [W.weddingDate, W.venue].filter(Boolean).join(" · ");
$("welcome").textContent = W.welcomeMessage;
if (W.headerPhoto) { $("headerPhoto").src = W.headerPhoto; $("headerPhoto").hidden = false; }
if (W.logo) {
  const img = $("logo");
  img.onload = () => img.classList.add("go");
  img.src = W.logo;
  img.hidden = false;
  if (img.complete) img.classList.add("go");
}

// ---------- motion ----------
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!calm) {
  const t = W.logo ? 0.8 : 0.1;
  const root = document.documentElement.style;
  root.setProperty("--t0", t.toFixed(2) + "s");
  root.setProperty("--t1", (t + 0.5).toFixed(2) + "s");
  root.setProperty("--t2", (t + 0.7).toFixed(2) + "s");
  root.setProperty("--t3", (t + 1.0).toFixed(2) + "s");
  document.documentElement.classList.add("motion");
}

// When every upload has finished, a few petals drift down. About 5 seconds, then gone.
function burst() {
  if (calm) return;
  const cv = document.createElement("canvas");
  cv.className = "burst";
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  document.body.append(cv);
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const cols = [css.getPropertyValue("--primary"), css.getPropertyValue("--accent"), "#b48cc8", "#e9dccb"].map((c) => c.trim()).filter(Boolean);
  const ps = Array.from({ length: 22 }, (_, i) => ({
    x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vy: 1.1 + Math.random() * 1.1,
    ph: Math.random() * 6.3, sw: 0.6 + Math.random() * 0.9, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.04,
    s: 5 + Math.random() * 5, c: cols[i % cols.length],
  }));
  const t0 = performance.now();
  (function step(t) {
    g.clearRect(0, 0, w, h);
    const fade = Math.max(0, Math.min(1, 1 - (t - t0 - 4000) / 1200));
    for (const p of ps) {
      p.y += p.vy; p.ph += 0.03; p.x += Math.sin(p.ph) * p.sw; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r + Math.sin(p.ph) * 0.5);
      g.globalAlpha = 0.85 * fade; g.fillStyle = p.c;
      g.beginPath(); g.ellipse(0, 0, p.s, p.s * 0.5, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    if (fade > 0) requestAnimationFrame(step); else cv.remove();
  })(t0);
}

// Each finished upload drops onto the pile as a small print.
let prints = 0;
function addPrint(it) {
  const pile = $("pile");
  pile.hidden = false;
  const card = document.createElement("div");
  card.className = "print";
  const img = document.createElement("i");
  if (it.thumbUrl) img.style.backgroundImage = `url(${it.thumbUrl})`;
  it.print = img;
  card.append(img);
  const n = prints++;
  const rz = ((n * 37) % 25) - 12 + (Math.random() * 4 - 2);
  const dx = ((n * 53) % 90) - 45;
  const rest = `translate3d(${dx}px, 0, 0) rotateZ(${rz.toFixed(1)}deg)`;
  card.style.transform = rest;
  pile.append(card);
  while (pile.children.length > 9) pile.firstChild.remove();
  if (!calm) {
    card.animate([
      { transform: `translate3d(${dx}px, -160px, 240px) rotateX(55deg) rotateZ(${(rz * 3).toFixed(1)}deg)`, opacity: 0 },
      { opacity: 1, offset: 0.3 },
      { transform: rest },
    ], { duration: 900, easing: "cubic-bezier(.2, .8, .3, 1)" });
  }
}

// ---------- upload window ----------
function fmtDate(iso, withTime) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const opts = { month: "long", day: "numeric", timeZone: W.timezone || undefined };
  if (withTime) Object.assign(opts, { hour: "numeric", minute: "2-digit" });
  try { return new Intl.DateTimeFormat("en-US", opts).format(d); }
  catch { delete opts.timeZone; return new Intl.DateTimeFormat("en-US", opts).format(d); }
}

async function refreshStatus() {
  let s = { open: true, state: "open", isAdmin: false };
  try { s = await (await fetch("/api/status", { cache: "no-store" })).json(); } catch {}
  const canUpload = s.open || s.isAdmin;
  $("uploader").hidden = !canUpload;
  $("closed").hidden = canUpload;
  $("adminNote").hidden = !(s.isAdmin && !s.open);
  if (!canUpload) {
    if (s.state === "before") {
      $("closedTitle").textContent = "Uploads open on " + fmtDate(W.uploadOpens);
      $("closedHint").textContent = "Come back from " + fmtDate(W.uploadOpens, true) + " to share your photos and videos.";
      startCountdown();
    } else {
      $("closedTitle").textContent = "Uploads are closed";
      $("closedHint").textContent = "Thank you for every photo and video.";
    }
  }
  return s;
}
// One flip-clock tile: the old top half folds down, revealing the new number.
function half(cls, text) {
  const d = document.createElement("div");
  d.className = "half " + cls;
  const sp = document.createElement("span");
  sp.textContent = text;
  d.append(sp);
  return d;
}
function flipTo(tile, text) {
  const old = tile.dataset.v;
  if (old === text) return;
  tile.dataset.v = text;
  clearTimeout(tile._t);
  if (old === undefined || calm || document.hidden) {
    tile.replaceChildren(half("top", text), half("bot", text));
    return;
  }
  tile.replaceChildren(half("top", text), half("bot", old), half("top flip-out", old), half("bot flip-in", text));
  tile._t = setTimeout(() => tile.replaceChildren(half("top", text), half("bot", text)), 650);
}
let countdownTimer = 0;
function startCountdown() {
  const target = Date.parse(W.uploadOpens);
  if (isNaN(target) || countdownTimer) return;
  $("countdown").hidden = false;
  const ids = ["cdD", "cdH", "cdM", "cdS"];
  const tick = () => {
    const left = Math.max(0, Math.floor((target - Date.now()) / 1000));
    const v = [Math.floor(left / 86400), Math.floor((left % 86400) / 3600), Math.floor((left % 3600) / 60), left % 60];
    v.forEach((x, i) => flipTo($(ids[i]), i ? String(x).padStart(2, "0") : String(x)));
    if (left === 0) {
      clearInterval(countdownTimer);
      setTimeout(refreshStatus, 1500);
    }
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}
let status = await refreshStatus();
// Flip the page open automatically if someone is waiting on it.
if (status.state === "before") {
  const wait = new Date(W.uploadOpens) - Date.now();
  if (wait > 0 && wait < 864e5) setTimeout(refreshStatus, wait + 1500);
}

// ---------- name ----------
const NAME_KEY = "wedding-guest-name";
try { $("guestName").value = localStorage.getItem(NAME_KEY) || ""; } catch {}
$("guestName").addEventListener("change", () => {
  try { localStorage.setItem(NAME_KEY, $("guestName").value.trim()); } catch {}
});

// ---------- queue ----------
const items = [];
let running = 0;

$("pickBtn").addEventListener("click", () => $("files").click());
$("files").addEventListener("change", (e) => {
  const guest = $("guestName").value.trim();
  try { localStorage.setItem(NAME_KEY, guest); } catch {}
  for (const file of e.target.files) addItem(file, guest);
  e.target.value = "";
  pump();
});
$("retryAll").addEventListener("click", () => {
  for (const it of items) if (it.state === "error") retry(it);
});

function addItem(file, guest) {
  const li = document.createElement("li");
  li.className = "item";
  li.innerHTML = `<div class="thumb"></div>
    <div><div class="name"></div><div class="bar"><i></i></div>
    <div class="status"><span class="msg">Waiting…</span><span class="pct"></span></div></div>`;
  li.querySelector(".name").textContent = file.name;
  $("list").prepend(li);
  const it = { file, guest, li, state: "queued", sent: 0, tries: 0, mpu: null, key: null };
  if (file.size > MAX_FILE) { fail(it, "Too large (max 5 GB)", false); }
  items.push(it);
  $("queue").hidden = false;
  render();
  makeThumb(file).then((blob) => {
    it.thumb = blob;
    if (blob) {
      it.thumbUrl = URL.createObjectURL(blob);
      li.querySelector(".thumb").style.backgroundImage = `url(${it.thumbUrl})`;
      if (it.print) it.print.style.backgroundImage = `url(${it.thumbUrl})`;
    }
  });
}

function pump() {
  while (running < PARALLEL) {
    const it = items.find((x) => x.state === "queued");
    if (!it) break;
    running++;
    it.state = "uploading";
    run(it).finally(() => { running--; pump(); render(); });
  }
  render();
}

async function run(it) {
  setMsg(it, "Uploading…");
  try {
    if (it.file.size <= SINGLE_LIMIT) await uploadSingle(it);
    else await uploadMultipart(it);
    it.state = "done";
    it.sent = it.file.size;
    it.li.classList.add("done");
    setMsg(it, "Uploaded", "");
    addPrint(it);
    await uploadThumb(it);
  } catch (err) {
    if (err.fatal) return fail(it, err.message, false);
    it.tries++;
    if (it.tries < AUTO_RETRIES) {
      setMsg(it, `Weak signal, trying again (${it.tries}/${AUTO_RETRIES - 1})…`);
      await sleep(1500 * it.tries * it.tries);
      return run(it);
    }
    fail(it, err.message || "Upload failed", true);
  }
}

function fail(it, message, canRetry) {
  it.state = "error";
  it.li.classList.add("error");
  const st = it.li.querySelector(".status");
  st.innerHTML = "";
  const msg = document.createElement("span");
  msg.textContent = message;
  st.append(msg);
  if (canRetry) {
    const b = document.createElement("button");
    b.className = "retry";
    b.type = "button";
    b.textContent = "Try again";
    b.onclick = () => retry(it);
    st.append(b);
  }
  render();
}

function retry(it) {
  it.state = "queued";
  it.tries = 0;
  it.li.classList.remove("error");
  it.li.querySelector(".status").innerHTML = `<span class="msg">Waiting…</span><span class="pct"></span>`;
  pump();
}

// ---------- transport ----------
function xhr(method, url, body, onProgress, contentType) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open(method, url);
    if (contentType) x.setRequestHeader("Content-Type", contentType);
    if (onProgress) x.upload.onprogress = (e) => onProgress(e.loaded);
    x.onload = () => {
      let data = {};
      try { data = JSON.parse(x.responseText); } catch {}
      if (x.status >= 200 && x.status < 300) return resolve(data);
      const e = new Error(data.error || `Upload failed (${x.status})`);
      // 4xx other than timeouts/rate limits won't fix themselves by retrying.
      e.fatal = x.status >= 400 && x.status < 500 && ![408, 429].includes(x.status);
      if (x.status === 403) refreshStatus();
      reject(e);
    };
    x.onerror = () => reject(new Error("Connection lost"));
    x.ontimeout = () => reject(new Error("Connection timed out"));
    x.send(body);
  });
}

async function postJson(url, data) {
  return xhr("POST", url, JSON.stringify(data), null, "application/json");
}

async function uploadSingle(it) {
  const q = new URLSearchParams({ name: it.file.name, guest: it.guest });
  const res = await xhr("PUT", "/api/upload?" + q, it.file, (n) => progress(it, n), it.file.type || "application/octet-stream");
  it.key = res.key;
}

async function uploadMultipart(it) {
  // it.mpu survives retries, so a retry continues from the part that failed.
  if (!it.mpu) {
    const res = await postJson("/api/mpu/create", { name: it.file.name, type: it.file.type, size: it.file.size, guest: it.guest });
    it.mpu = { key: res.key, uploadId: res.uploadId, parts: [] };
  }
  const { key, uploadId, parts } = it.mpu;
  const total = Math.ceil(it.file.size / PART_SIZE);
  for (let n = parts.length + 1; n <= total; n++) {
    const start = (n - 1) * PART_SIZE;
    const blob = it.file.slice(start, Math.min(start + PART_SIZE, it.file.size));
    const q = new URLSearchParams({ key, uploadId, part: n });
    let partTry = 0;
    for (;;) {
      try {
        const res = await xhr("PUT", "/api/mpu/part?" + q, blob, (b) => progress(it, start + b), "application/octet-stream");
        parts.push({ partNumber: res.partNumber, etag: res.etag });
        break;
      } catch (e) {
        if (e.fatal || ++partTry >= 3) throw e;
        setMsg(it, `Retrying part ${n} of ${total}…`);
        await sleep(2000 * partTry);
      }
    }
  }
  try {
    await postJson("/api/mpu/complete", { key, uploadId, parts });
  } catch (e) {
    if (e.fatal) it.mpu = null; // upload session is gone; start fresh next time
    throw e;
  }
  it.key = key;
}

async function uploadThumb(it) {
  // Wait briefly for the thumbnail if it's still being made.
  for (let i = 0; i < 20 && it.thumb === undefined; i++) await sleep(500);
  if (!it.thumb || !it.key) return;
  try { await xhr("PUT", "/api/thumb?key=" + encodeURIComponent(it.key), it.thumb, null, "image/jpeg"); } catch {}
}

// ---------- thumbnails (made on the phone; the server has no CPU to spare) ----------
const THUMB = 480;
let thumbChain = Promise.resolve();
function makeThumb(file) {
  // One at a time so phones don't run out of memory on big batches.
  const p = thumbChain.then(() => (file.type.startsWith("video/") ? videoThumb(file) : imageThumb(file)).catch(() => null));
  thumbChain = p;
  return p;
}
function toJpeg(source, w, h) {
  const scale = Math.min(1, THUMB / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * scale));
  c.height = Math.max(1, Math.round(h * scale));
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob((b) => { c.width = c.height = 0; r(b); }, "image/jpeg", 0.8));
}
function imageThumb(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.decoding = "async";
    img.onload = async () => {
      try { resolve(await toJpeg(img, img.naturalWidth, img.naturalHeight)); }
      catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}
function videoThumb(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    let done = false;
    const finish = (val, err) => {
      if (done) return;
      done = true;
      v.removeAttribute("src"); v.load();
      URL.revokeObjectURL(url);
      err ? reject(err) : resolve(val);
    };
    const timer = setTimeout(() => finish(null, new Error("timeout")), 10000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadedmetadata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
    v.onseeked = async () => {
      clearTimeout(timer);
      try { finish(await toJpeg(v, v.videoWidth, v.videoHeight)); } catch (e) { finish(null, e); }
    };
    v.onerror = () => { clearTimeout(timer); finish(null, new Error("video")); };
    v.src = url;
  });
}

// ---------- progress UI ----------
function progress(it, sent) {
  it.sent = sent;
  const pct = Math.min(100, Math.round((sent / it.file.size) * 100));
  it.li.querySelector(".bar > i").style.width = pct + "%";
  const p = it.li.querySelector(".pct");
  if (p) p.textContent = pct + "%";
  renderTotals();
}
function setMsg(it, text, pct) {
  const m = it.li.querySelector(".msg");
  if (m) m.textContent = text;
  if (pct !== undefined) { const p = it.li.querySelector(".pct"); if (p) p.textContent = pct; }
}
let rafPending = false;
function renderTotals() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    let total = 0, sent = 0;
    for (const it of items) { total += it.file.size; sent += it.state === "done" ? it.file.size : it.sent; }
    $("totalBar").style.width = (total ? (sent / total) * 100 : 0) + "%";
  });
}
function render() {
  const done = items.filter((i) => i.state === "done").length;
  const failed = items.filter((i) => i.state === "error").length;
  const active = items.length - done - failed;
  $("summaryText").innerHTML = active
    ? `Uploading <b>${done}</b> of <b>${items.length}</b>… keep this page open`
    : `<b>${done}</b> of <b>${items.length}</b> uploaded` + (failed ? ` · <b>${failed}</b> failed` : "");
  $("retryAll").hidden = !failed || active > 0;
  const allDone = !!items.length && done === items.length;
  if (allDone && $("thanks").hidden) burst();
  $("thanks").hidden = !allDone;
  $("queue").classList.toggle("busy", active > 0);
  for (const it of items) if (it.state === "done") it.li.querySelector(".bar > i").style.width = "100%";
  renderTotals();
  setBusy(active > 0);
}

// ---------- keep the phone awake & warn before leaving ----------
let busy = false, wakeLock = null;
async function lockScreen() {
  try { if (busy && "wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); } } catch {}
}
function setBusy(b) {
  if (b === busy) return;
  busy = b;
  if (b) lockScreen();
  else if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") lockScreen(); });
window.addEventListener("beforeunload", (e) => { if (busy) { e.preventDefault(); e.returnValue = ""; } });

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
</script>
</body>
